# city99-lora, city99-supe: reticulous/sim/scenarios/city99.yaml's 99 positions, every one a
# LoRa station named after its id (n01 was city99's internet, n02-n08 gw02-gw08,
# n09-n11 out09-out11). Transport as city99 has it: on everywhere but n09-n11.
# No internet station, no TCP peers, no netgraph community.
# city99-lora.yaml and city99-supe.yaml differ only in the two SUPE lines of `setup:`.
origin: [52.374, 4.8897]
physics: { exponent: 2.7, noise_figure_db: 6, capture_db: 6 }
kinds:
  reticulous:
    elf: "../../../reticulous/esp-idf/build.linux/reticulous.elf"
    fixed: "../../../reticulous/esp-idf/build.linux/data_merged"
setup:
  - "hostname {name}"
  - "auth passwd admin admin"
  - "lxmf create {name}"
  - "lora up"
  - "lora 0 freq 869.525"
  - "lora 0 sf 8"
  - "lora 0 bw 125"
  - "lora 0 cr 5"
  - "lora 0 txp 14"
  - "set s.rnsd.dir.persist_routes 1"
  - "set s.rnsd.dir.persist_s 60"
  - "set s.lora.0.SUPE.afa 1"
  - "lora 0 supe enable"
