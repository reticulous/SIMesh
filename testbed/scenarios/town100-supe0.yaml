  - "lora 0 sf 7"
  - "lora 0 bw 125"
  - "lora 0 cr 5"
  - "lora 0 txp 14"
  - "set s.rnsd.dir.persist_routes 1"
  - "set s.rnsd.dir.persist_s 60"
  - "set s.lora.0.SUPE.afa 0"
  - "lora 0 supe enable"
