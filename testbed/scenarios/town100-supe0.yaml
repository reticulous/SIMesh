# gen_town100.py 1 (see its docstring for the parameters). Main street, 6
# neighbourhood clusters (spread x1.00), 5 edge stations; SF7 reaches 1163 m;
# neighbours per station median 19.5 (min 4), hop diameter 7 (7 through transports).
# Transport on at 33 stations. The files differ only in their SUPE lines.
origin: [52.374, 4.8897]
physics: { exponent: 3.5, noise_figure_db: 6, capture_db: 6 }
kinds:
  reticulous:
    elf: "../../../reticulous/esp-idf/build.linux/reticulous.elf"
    fixed: "../../../reticulous/esp-idf/build.linux/data_merged"
